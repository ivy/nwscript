[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "ISC"
repository = "https://github.com/ivy/nwscript"

[workspace.dependencies]
nwscript = { path = "crates/nwscript" }
nwscript-diag = { path = "crates/nwscript-diag" }
nwscript-ncs = { path = "crates/nwscript-ncs" }
nwscript-syntax = { path = "crates/nwscript-syntax" }
nwscript-sema = { path = "crates/nwscript-sema" }
nwscript-vm = { path = "crates/nwscript-vm" }
nwscript-codegen = { path = "crates/nwscript-codegen" }
nwscript-decomp = { path = "crates/nwscript-decomp" }
nwscript-lua = { path = "crates/nwscript-lua" }
nwscript-py = { path = "crates/nwscript-py" }
rakata-res = { path = "crates/rakata-res" }
rakata-lip = { path = "crates/rakata-lip" }
rakata-texture = { path = "crates/rakata-texture" }
rakata-lyt = { path = "crates/rakata-lyt" }
rakata-walkmesh = { path = "crates/rakata-walkmesh" }
rakata-mdl = { path = "crates/rakata-mdl" }
rakata-archive = { path = "crates/rakata-archive" }
rakata-2da = { path = "crates/rakata-2da" }
rakata-gff = { path = "crates/rakata-gff" }
rakata-patch = { path = "crates/rakata-patch" }
rakata-tlk = { path = "crates/rakata-tlk" }
rakata = { path = "crates/rakata" }
rakata-game = { path = "crates/rakata-game" }
rakata-save = { path = "crates/rakata-save" }
rakata-cli = { path = "crates/rakata-cli" }
rakata-dialog = { path = "crates/rakata-dialog" }
rakata-index = { path = "crates/rakata-index" }
rakata-lua = { path = "crates/rakata-lua" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
