[package]
name = "nwscript-py"
description = "Python bindings of the nwscript façade, the same shape as the Lua binding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "nwscript_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
nwscript = { workspace = true }
pyo3 = { version = "0.30", features = ["extension-module"] }
serde_json = "1"

[lints]
workspace = true
