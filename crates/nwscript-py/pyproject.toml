[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "nwscript"
description = "NWScript compiler, interpreter and bytecode tools, from Rust"
requires-python = ">=3.10"
license = "ISC"
dynamic = ["version"]

[tool.maturin]
module-name = "nwscript"
features = ["pyo3/extension-module"]
