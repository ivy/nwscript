[package]
name = "rakata-cli"
description = "The rakata command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rakata"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
serde_json = "1"
rakata = { workspace = true }

[dev-dependencies]
assert_cmd = "2.2"
tempfile = "3"
predicates = "3.1"
serde_json = "1"

[lints]
workspace = true
