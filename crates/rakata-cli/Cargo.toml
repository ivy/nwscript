[package]
name = "rakata-cli"
description = "The rakata command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rakata"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
serde_json = "1"
nwscript-diag = { workspace = true }
nwscript-ncs = { workspace = true }
rakata = { workspace = true }
rakata-res = { workspace = true }
rakata-lua = { workspace = true }

[dev-dependencies]
assert_cmd = "2.2"
tempfile = "3"
rakata-archive = { workspace = true }
rakata-gff = { workspace = true }
png = "0.18"
predicates = "3.1"
serde_json = "1"
nwscript-diag = { workspace = true }
nwscript-ncs = { workspace = true }

[lints]
workspace = true
