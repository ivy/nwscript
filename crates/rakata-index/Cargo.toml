[package]
name = "rakata-index"
description = "The index of a game tree: facts, references and full text over every resource, keyed by content hash, in SQLite; incremental from a list of changed paths."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nwscript-diag = { workspace = true }
nwscript-ncs = { workspace = true }
rakata-2da = { workspace = true }
rakata-archive = { workspace = true }
rakata-dialog = { workspace = true }
rakata-gff = { workspace = true }
rakata-lyt = { workspace = true }
rakata-mdl = { workspace = true }
rakata-res = { workspace = true }
rakata-tlk = { workspace = true }
rusqlite = { version = "0.39", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
