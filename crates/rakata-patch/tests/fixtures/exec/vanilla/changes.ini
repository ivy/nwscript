; A hand-made mod against a vanilla KotOR 1 install: every target starts
; from the game's own files, none of which the installer ships. The talk
; table appends one line; appearance.2da comes from 2da.bif; the creature
; goes into danm13.mod, which does not exist and is made from the module's
; RIMs; the script includes a vanilla header from scripts.bif.
[Settings]
LookupGameNumber=1

[TLKList]
StrRef0=0

[2DAList]
Table0=appearance.2da

[appearance.2da]
AddRow0=rakata_row

[rakata_row]
ExclusiveColumn=label
label=Rakata_Test
2DAMEMORY1=RowIndex

[GFFList]
File0=dan13_belaya.utc

[dan13_belaya.utc]
!Destination=modules\danm13.mod
Appearance_Type=2DAMEMORY1
FirstName(strref)=StrRef0

[CompileList]
Replace0=k_rakata_tok.nss
