; Defect 6 of modshop's series: a Replace# into a .mod that already holds
; the resource left the old bytes there while logging success. The first
; folder replaces a member testmod.mod holds; the second installs into
; other.mod, which does not exist yet and is made from other.rim and
; other_s.rim; the third copies with File#, which a held member skips.
[Settings]
LookupGameNumber=1

[InstallList]
install_folder0=modules\testmod.mod
install_folder1=modules\other.mod
install_folder2=modules\testmod.mod

[install_folder0]
Replace0=k_test.ncs

[install_folder1]
Replace0=k_new.ncs

[install_folder2]
File0=m_npc.utc
