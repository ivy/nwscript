; Defects 1 and 8 of modshop's series: a [CompileList] with Replace#
; entries, compiled the same way on every platform. The scripts compile
; through nwscript against the install; the nwnnsscomp.exe beside them in
; tslpatchdata is never run. k_tok.nss reads a token a 2DA row stored;
; k_kept.ncs is in Override already, so File2 skips it.
[Settings]
LookupGameNumber=1

[2DAList]
Table0=appearance.2da

[appearance.2da]
AddRow0=compile_row

[compile_row]
label=Compiled
2DAMEMORY1=RowIndex

[CompileList]
Replace0=k_test.nss
Replace1=k_tok.nss
File2=k_kept.nss
