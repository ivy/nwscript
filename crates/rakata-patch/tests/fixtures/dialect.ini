; The dialect's edges: CRLF or LF, spaces around =, a value with = in it, a
; repeated key, a repeated section, a line that is nothing, and keys that
; differ only in case.
[settings]
loglevel = 3
WindowCaption=a=b
LogLevel=4

[GFFList]
File0=x.utc

[x.utc]
Tag=first
// not a comment
Orphan

[x.utc]
Tag=second
