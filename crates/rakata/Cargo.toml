[package]
name = "rakata"
description = "The façade of the data toolset: one API over the rakata-* crates, and their diagnostic codes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
nwscript-diag = { workspace = true }
rakata-archive = { workspace = true }
rakata-2da = { workspace = true }
rakata-game = { workspace = true }
rakata-lip = { workspace = true }
rakata-res = { workspace = true }
rakata-patch = { workspace = true }
rakata-tlk = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
sha2 = "0.10"

[lints]
workspace = true
