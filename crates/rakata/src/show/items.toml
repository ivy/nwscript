# The 2DA tables and columns that resolve an item's properties and base
# item, for `rakata show` (crates/rakata/src/show.rs).
#
# Generated by scripts/measure-item-properties.py over an index of a vanilla
# KotOR 1 install; no game bytes are recorded, only table and column names
# and the counts below. Regenerate rather than edit.
#
# Method. Every property of every vanilla .uti (1969 properties on the 530
# distinct .uti that have one) is tried against the tables; each column is
# the one that resolves the most of them.
#
# - PropertyName is a row of itempropdef for 1969 of 1969; the row's `name`
#   names text for 1969.
# - The subtype table is the itempropdef column `subtyperesref`: of the 1257
#   properties whose row names one, the Subtype is a row of it for 1257.
# - The cost table is the 2DA that iprp_costtable's column `name` names in
#   the property's own CostTable row. For 420 properties that 2DA has no
#   rows (iprp_base1): the property has no value. For the other 1549, the
#   CostValue is a row of it for 1549. itempropdef's `costtableresref`
#   equals the CostTable for 1933 of 1969; the property's own field is read.
# - Param1 is 255 (no parameter) for 1775 of 1969; for the other 194, the
#   parameter table is the 2DA that iprp_paramtable's column `tableresref`
#   names, and Param1Value is a row of it for 194.
# - A value's name is the column `name`, a strref with text in 2801 of the
#   2806 subtype and cost rows used; `label` (filled in 2777 of them) is the
#   fallback where it has none.
# - BaseItem is a row of baseitems for 873 of the 873 distinct .uti; the
#   row's `name` names text for 870.

[properties]
table = "itempropdef"
subtype = "subtyperesref"
cost_table = "costtableresref"

[costs]
table = "iprp_costtable"
resref = "name"

[params]
table = "iprp_paramtable"
resref = "tableresref"
none = 255

[values]
name = "name"
label = "label"

[base_items]
table = "baseitems"
