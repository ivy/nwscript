[tools]
rust = "1.99.0"
uv = "0.13.5"

[tasks."test:py"]
description = "Build the rakata Python module into a uv environment with maturin develop, then run its pytest suite and pyright"
dir = "{{config_root}}/crates/rakata-py"
env = { UV_PROJECT_ENVIRONMENT = "{{config_root}}/target/rakata-py/venv" }
run = [
  "uv sync --quiet --no-install-project",
  "uv run --no-sync maturin develop --uv",
  "uv run --no-sync pytest -q tests",
  "uv run --no-sync pyright tests",
]
