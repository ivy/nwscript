[package]
name = "xtask"
description = "Development tasks: corpus extraction and verification, the grammar census, the ini census, the README's generated tables, the benchmark against other tools."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
rakata = { workspace = true }
rakata-archive = { workspace = true }
rakata-gff = { workspace = true }
rakata-mdl = { workspace = true }
rakata-res = { workspace = true }
rakata-patch = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[lints]
workspace = true
